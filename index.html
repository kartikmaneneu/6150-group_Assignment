<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Nest Roommate Matchmaker</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom styles -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">

  <div class="container-fluid">
    <div class="row min-vh-100">

      <!-- Left: brand panel with the night-time house (hidden detail on small screens) -->
      <aside class="col-lg-6 login-brand d-flex flex-column justify-content-between p-4 p-md-5">
        <a href="index.html" class="brand-mark text-decoration-none">
          <span class="brand-roof" aria-hidden="true"></span> Nest
        </a>

        <div class="text-center my-4 d-none d-md-block">
          <div class="house house-static mx-auto" aria-hidden="true">
            <div class="house-roof"></div>
            <div class="house-body">
              <span class="window lit"></span>
              <span class="window"></span>
              <span class="window lit"></span>
              <span class="window"></span>
              <span class="window lit"></span>
              <span class="window lit"></span>
            </div>
            <div class="house-door"></div>
          </div>
        </div>

        <div>
          <h1 class="login-headline">Welcome home.</h1>
          <p class="login-sub mb-0">Sign in to see who you'd actually live well with: bedtimes, dishes, guests and all.</p>
        </div>
      </aside>

      <!-- Right: login form -->
      <main class="col-lg-6 d-flex align-items-center justify-content-center p-4 p-md-5">
        <div class="login-card w-100">
          <h2 class="h3 mb-1">Sign in</h2>
          <p class="text-body-secondary mb-4">Use your university email to join your campus.</p>

          <!-- Error summary (Bootstrap alert) -->
          <!-- Shows validation, sign-in errors, or the registration success notice. -->
          <div id="loginAlert" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>

          <form id="loginForm" novalidate>
            <!-- Email (floating label) -->
            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="email" placeholder="name@university.edu" autocomplete="email" aria-describedby="emailFeedback">
              <label for="email">University email</label>
              <div id="emailFeedback" class="invalid-feedback"></div>
            </div>

            <!-- Password with show/hide (input group) -->
            <div class="input-group has-validation mb-2">
              <div class="form-floating">
                <input type="password" class="form-control" id="password" placeholder="Password" autocomplete="current-password" aria-describedby="passwordFeedback">
                <label for="password">Password</label>
              </div>
              <button class="btn btn-outline-secondary toggle-pass" type="button" id="togglePassword" aria-label="Show password" aria-pressed="false">Show</button>
              <div id="passwordFeedback" class="invalid-feedback"></div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Keep me signed in</label>
              </div>
              <a href="#" class="small link-nest" data-bs-toggle="modal" data-bs-target="#forgotModal">Forgot password?</a>
            </div>

            <button type="submit" id="loginBtn" class="btn btn-nest w-100 py-3">
              <span class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
              <span class="btn-label">Sign in</span>
            </button>
          </form>

          <!-- New users create an account on the separate registration page. -->
          <p class="text-center small text-body-secondary mt-4 mb-0">
            New to Nest? <a class="link-nest" href="register.html">Sign up</a> to create your account.
          </p>
        </div>
      </main>
    </div>
  </div>

  <!-- Forgot password (Bootstrap modal) -->
  <div class="modal fade" id="forgotModal" tabindex="-1" aria-labelledby="forgotTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="forgotTitle">Reset your password</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="forgotForm" novalidate>
          <div class="modal-body">
            <div id="forgotSuccess" class="alert alert-success d-none" role="status"></div>
            <label for="forgotEmail" class="form-label">University email</label>
            <input type="email" class="form-control" id="forgotEmail" placeholder="name@university.edu" aria-describedby="forgotFeedback">
            <div id="forgotFeedback" class="invalid-feedback"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-nest">Send reset link</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
