<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | Nest Roommate Matchmaker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">

  <div class="container-fluid">
    <div class="row min-vh-100">
      <aside class="col-lg-6 login-brand d-flex flex-column justify-content-between p-4 p-md-5">
        <a href="index.html" class="brand-mark text-decoration-none">
          <span class="brand-roof" aria-hidden="true"></span> Nest
        </a>

        <div class="text-center my-4 d-none d-md-block">
          <div class="house house-static mx-auto" aria-hidden="true">
            <div class="house-roof"></div>
            <div class="house-body">
              <span class="window lit"></span>
              <span class="window"></span>
              <span class="window lit"></span>
              <span class="window"></span>
              <span class="window lit"></span>
              <span class="window lit"></span>
            </div>
            <div class="house-door"></div>
          </div>
        </div>

        <div>
          <h1 class="login-headline">Make yourself at home.</h1>
          <p class="login-sub mb-0">Create your Nest account and find a roommate who fits your everyday life.</p>
        </div>
      </aside>

      <main class="col-lg-6 d-flex align-items-center justify-content-center p-4 p-md-5">
        <div class="login-card w-100">
          <h2 class="h3 mb-1">Create your account</h2>
          <p class="text-body-secondary mb-4">Sign up with your university email to get started.</p>

          <div id="registerAlert" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>

          <form id="registerForm" novalidate>
            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="registerEmail" placeholder="name@university.edu" autocomplete="email" aria-describedby="registerEmailFeedback">
              <label for="registerEmail">University email</label>
              <div id="registerEmailFeedback" class="invalid-feedback"></div>
            </div>

            <div class="form-floating mb-3">
              <input type="password" class="form-control" id="registerPassword" placeholder="Password" autocomplete="new-password" aria-describedby="registerPasswordFeedback registerPasswordRules">
              <label for="registerPassword">Password</label>
              <div id="registerPasswordFeedback" class="invalid-feedback"></div>
            </div>

            <ul id="registerPasswordRules" class="list-group list-group-flush rule-list mb-3" aria-label="Password requirements">
              <li class="list-group-item" data-rule="length">At least 8 characters</li>
              <li class="list-group-item" data-rule="upper">One uppercase letter</li>
              <li class="list-group-item" data-rule="number">One number</li>
            </ul>

            <div class="form-floating mb-4">
              <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm password" autocomplete="new-password" aria-describedby="confirmPasswordFeedback">
              <label for="confirmPassword">Confirm password</label>
              <div id="confirmPasswordFeedback" class="invalid-feedback"></div>
            </div>

            <button type="submit" id="registerBtn" class="btn btn-nest w-100 py-3">
              <span class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
              <span class="btn-label">Sign up</span>
            </button>
          </form>

          <p class="text-center small text-body-secondary mt-4 mb-0">
            Already have an account? <a class="link-nest" href="index.html">Sign in</a>
          </p>
        </div>
      </main>
    </div>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
